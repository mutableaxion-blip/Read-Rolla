plugins { id 'com.android.application' }

android {
    namespace 'com.lilolax.readrolla'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lilolax.readrolla'
        minSdk 26
        targetSdk 33
        versionCode 16
        versionName '1.15'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html' }
}
