name: Build the Read Rolla app
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name it
        run: cp app/build/outputs/apk/debug/app-debug.apk ReadRolla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReadRolla-apk
          path: ReadRolla.apk
      - name: Put it on the Releases page (an easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Read Rolla build ${{ github.run_number }}
          files: ReadRolla.apk
